
name: Build DOMINOS CLUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -o DOMINOS_CLUB_V11_7_5_7_ANDROID_STUDIO_PROJECT.zip -d .

      - name: Build APK
        working-directory: DOMINOS_CLUB_ANDROID_PROJECT
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOMINOS-CLUB-V11.7.5.7
          path: DOMINOS_CLUB_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk
          
